services:
  postgres:
    image: postgres:13
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: always

  airflow-init:
    build: .
    depends_on:
      - postgres
    environment: &airflow-common-env
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__FERNET_KEY: ""
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: "http://airflow-webserver:8080/execution/"
      AIRFLOW__API_AUTH__JWT_SECRET: "a-local-dev-secret-change-if-you-care"
      # Local dev only: skips the login screen entirely, everyone is admin.
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "True"
      DBT_PROFILES_DIR: /opt/airflow/.dbt
    volumes: &airflow-common-volumes
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins
      - ./config:/opt/airflow/config
      - ../src:/opt/airflow/src
      - ../dbt:/opt/airflow/dbt
      - ../ml:/opt/airflow/ml
      - ../models:/opt/airflow/models
      - ../data:/opt/airflow/data
      - ./dbt_profiles:/opt/airflow/.dbt
    command: bash -c "airflow db migrate"

  airflow-webserver:
    build: .
    depends_on:
      - airflow-init
    environment: *airflow-common-env
    volumes: *airflow-common-volumes
    ports:
      - "8080:8080"
    command: airflow api-server
    restart: always

  airflow-scheduler:
    build: .
    depends_on:
      - airflow-init
    environment: *airflow-common-env
    volumes: *airflow-common-volumes
    command: airflow scheduler
    restart: always

  # Airflow 3 requires this as a SEPARATE service -- the scheduler no
  # longer parses DAG files itself. Without this, DAGs never get picked
  # up at all (no error, just "0 DAGs found" forever).
  airflow-dag-processor:
    build: .
    depends_on:
      - airflow-init
    environment: *airflow-common-env
    volumes: *airflow-common-volumes
    command: airflow dag-processor
    restart: always

volumes:
  postgres-db-volume: