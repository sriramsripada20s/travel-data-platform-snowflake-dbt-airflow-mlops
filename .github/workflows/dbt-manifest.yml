name: dbt Manifest (main)

on:
  push:
    branches: [main]
    paths:
      - "dbt/**"
  workflow_dispatch: # lets you manually trigger this from the Actions UI,
                       # without needing a real dbt/ change first -- exactly
                       # what's needed to produce the very first manifest

jobs:
  build-and-publish-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dbt
        run: pip install dbt-core dbt-snowflake

      - name: dbt build (real, against PROD)
        working-directory: dbt
        env:
          DBT_PROFILES_DIR: .
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
        run: |
          dbt deps
          dbt build --target prod

      - name: Publish manifest.json as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: dbt-manifest
          path: dbt/target/manifest.json
          retention-days: 30