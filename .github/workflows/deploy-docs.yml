name: Deploy dbt Docs

on:
  push:
    branches: [main]
    paths:
      - "dbt/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dbt
        run: pip install dbt-core dbt-snowflake

      - name: Write profile from secrets
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml << PROFILE
          travel_experience_platform:
            target: prod
            outputs:
              prod:
                type: snowflake
                account: "${{ secrets.SNOWFLAKE_ACCOUNT }}"
                user: "${{ secrets.SNOWFLAKE_USER }}"
                password: "${{ secrets.SNOWFLAKE_PASSWORD }}"
                role: ACCOUNTADMIN
                database: TRAVEL_PLATFORM
                warehouse: TRAVEL_WH
                schema: RAW
                threads: 4
          PROFILE

      - name: Generate docs
        working-directory: dbt
        run: |
          dbt deps
          dbt docs generate

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dbt/target

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Notify Slack on successful deploy
        if: success()
        run: |
          curl -X POST -H 'Content-type: application/json' \
            --data '{
              "text": ":rocket: *Deployed to production*\ndbt docs published to GitHub Pages\nCommit: \"'"${{ github.event.head_commit.message }}"'\" by '"${{ github.actor }}"'\nLive site: ${{ steps.deployment.outputs.page_url }}\nRun: https://github.com/'"${{ github.repository }}"'/actions/runs/'"${{ github.run_id }}"'"
            }' \
            "${{ secrets.SLACK_CI_WEBHOOK_URL }}"

      - name: Notify Slack on failure
        if: failure()
        run: |
          curl -X POST -H 'Content-type: application/json' \
            --data '{
              "text": ":rotating_light: *CD failed: deploy-docs*\nCommit: \"'"${{ github.event.head_commit.message }}"'\" by '"${{ github.actor }}"'\nRun: https://github.com/'"${{ github.repository }}"'/actions/runs/'"${{ github.run_id }}"'"
            }' \
            "${{ secrets.SLACK_CI_WEBHOOK_URL }}"