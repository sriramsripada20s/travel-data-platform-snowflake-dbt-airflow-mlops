name: Deploy Streamlit Dashboard

on:
  push:
    branches: [main]
    paths:
      - "streamlit_app/**"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://app.snowflake.com/ap-northeast-2.aws/vc93087/#/streamlit-apps/TRAVEL_PLATFORM.MARTS.TRAVEL_DASHBOARD
    env:
      # snowflake-cli-labs reads these SNOWFLAKE_* env vars directly --
      # no connections.toml file needed in a headless CI environment.
      # database/schema/warehouse/app identity come from streamlit_app/
      # snowflake.yml itself, not from here.
      SNOWFLAKE_ACCOUNT: "${{ secrets.SNOWFLAKE_ACCOUNT }}"
      SNOWFLAKE_USER: "${{ secrets.SNOWFLAKE_USER }}"
      SNOWFLAKE_PASSWORD: "${{ secrets.SNOWFLAKE_PASSWORD }}"
      SNOWFLAKE_ROLE: "ACCOUNTADMIN"
      SNOWFLAKE_WAREHOUSE: "TRAVEL_WH"
      SNOWFLAKE_DATABASE: "TRAVEL_PLATFORM"
      SNOWFLAKE_SCHEMA: "MARTS"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Snowflake CLI
        run: pip install snowflake-cli-labs

      - name: Deploy to Snowflake
        working-directory: streamlit_app
        run: snow streamlit deploy --replace --temporary-connection

      - name: Notify Slack on successful deploy
        if: success()
        run: |
          curl -X POST -H 'Content-type: application/json' \
            --data '{
              "text": ":rocket: *Deployed to production*\nStreamlit dashboard updated (TRAVEL_PLATFORM.MARTS.TRAVEL_DASHBOARD)\nCommit: \"'"${{ github.event.head_commit.message }}"'\" by '"${{ github.actor }}"'\nRun: https://github.com/'"${{ github.repository }}"'/actions/runs/'"${{ github.run_id }}"'"
            }' \
            "${{ secrets.SLACK_CI_WEBHOOK_URL }}"

      - name: Notify Slack on failure
        if: failure()
        run: |
          curl -X POST -H 'Content-type: application/json' \
            --data '{
              "text": ":rotating_light: *CD failed: deploy-streamlit*\nCommit: \"'"${{ github.event.head_commit.message }}"'\" by '"${{ github.actor }}"'\nRun: https://github.com/'"${{ github.repository }}"'/actions/runs/'"${{ github.run_id }}"'"
            }' \
            "${{ secrets.SLACK_CI_WEBHOOK_URL }}"
